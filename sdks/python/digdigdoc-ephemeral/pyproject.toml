[project]
name = "digdigdoc-ephemeral"
version = "0.1.0"
description = "SDK Python pour l'API éphémère (/api/ephemeral) de la plateforme dig-dig-doc"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "digdigdoc>=0.1.0,<0.2",
    "httpx>=0.28.1",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.15.0",
    "mypy>=1.13",
]

# Développement dans le monorepo : le SDK standard est résolu localement.
[tool.uv.sources]
digdigdoc = { path = "../digdigdoc", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "../testing"]
markers = ["integration: nécessite un backend dig-dig-doc accessible (DIGDIGDOC_BASE_URL / DIGDIGDOC_API_TOKEN)"]
addopts = "-m 'not integration' --cov=digdigdoc_ephemeral --cov-report=term-missing --cov-fail-under=90"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digdigdoc_ephemeral"]
