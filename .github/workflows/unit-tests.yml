name: Unit Tests

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run tests
        required: false
        type: string
        default: "3.12"
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run tests
        required: false
        type: string
        default: "3.12"

jobs:
  unit-tests-backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digdigdoc
          POSTGRES_PASSWORD: digdigdoc
          POSTGRES_DB: digdigdoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digdigdoc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        ports:
          - 9000:9000
        env:
          RUSTFS_VOLUMES: /data/rustfs0
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://digdigdoc:digdigdoc@localhost:5432/digdigdoc
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_BUCKET: dig-dig-doc
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        # --group test, not --group dev: the dev group also pulls in eralchemy2
        # (ER diagram generation), whose pygraphviz dependency needs system
        # graphviz headers this runner doesn't have - CI only needs the tests.
        run: uv sync --group test

      - name: Apply database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: uv run pytest

  unit-tests-worker-document-process:
    name: worker/document_process
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/document_process/uv.lock

      - name: Install worker dependencies
        working-directory: worker/document_process
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/document_process
        run: uv run pytest

  unit-tests-worker-agent-execution:
    name: worker/agent_execution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/agent_execution/uv.lock

      - name: Install worker dependencies
        working-directory: worker/agent_execution
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/agent_execution
        run: uv run pytest
