name: Lint

on:
  workflow_call:
    inputs:
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "22"
      PYTHON_VERSION:
        description: Python version used to run the backend/worker linters
        required: false
        type: string
        default: "3.12"
  workflow_dispatch:
    inputs:
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "22"
      PYTHON_VERSION:
        description: Python version used to run the backend/worker linters
        required: false
        type: string
        default: "3.12"

jobs:
  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm run typecheck

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        # --group test, not --group dev: the dev group also pulls in eralchemy2
        # (ER diagram generation), whose pygraphviz dependency needs system
        # graphviz headers this runner doesn't have - CI only needs the tests.
        run: uv sync --group test

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

  lint-worker-document-process:
    name: Lint worker/document_process
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/document_process/uv.lock

      - name: Install worker dependencies
        working-directory: worker/document_process
        run: uv sync --group dev

      - name: Ruff check
        working-directory: worker/document_process
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: worker/document_process
        run: uv run ruff format --check .

  lint-worker-agent-execution:
    name: Lint worker/agent_execution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/agent_execution/uv.lock

      - name: Install worker dependencies
        working-directory: worker/agent_execution
        run: uv sync --group dev

      - name: Ruff check
        working-directory: worker/agent_execution
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: worker/agent_execution
        run: uv run ruff format --check .
