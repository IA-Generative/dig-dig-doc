name: SDKs Python

on:
  pull_request:
    paths:
      - "sdks/python/**"
      - ".github/workflows/sdks.yml"
  workflow_dispatch:

concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [millefeuille, millefeuille-ephemeral]
    defaults:
      run:
        working-directory: sdks/python/${{ matrix.package }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install dependencies
        run: uv sync --python 3.12
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check (mypy --strict)
        run: uv run mypy src
      - name: Tests (pytest, couverture >= 90 %)
        run: uv run pytest
