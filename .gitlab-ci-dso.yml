include:
  - project: $CATALOG_PATH
    file:
      - vault-ci.yml
      - kaniko-ci.yml
    ref: main

default:
  image: alpine:latest

variables:
  TAG: "${CI_COMMIT_REF_SLUG}"
  REGISTRY_URL: "${REGISTRY_HOST}/${PROJECT_PATH}"

stages:
  - read-secret
  - lint
  - test
  - docker-build

read_secret:
  stage: read-secret
  extends:
    - .vault:read_secret

# --- Lint : même commandes que .github/workflows/lint.yml, pour que le
# mirroir GitLab ne laisse rien passer que la CI GitHub aurait bloqué. ---

lint-backend:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir uv
  script:
    - cd backend
    - uv sync --group test
    - uv run ruff check .
    - uv run ruff format --check .

lint-worker-document-process:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir uv
  script:
    - cd worker/document_process
    - uv sync
    - uv run ruff check .
    - uv run ruff format --check .

lint-worker-agent-execution:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir uv
  script:
    - cd worker/agent_execution
    - uv sync
    - uv run ruff check .
    - uv run ruff format --check .

lint-frontend:
  stage: lint
  image: node:22-slim
  before_script:
    - corepack enable
  script:
    - cd frontend
    - pnpm install --no-frozen-lockfile
    - pnpm run typecheck

# --- Tests : même commandes que .github/workflows/unit-tests.yml. ---

unit-tests-backend:
  stage: test
  image: python:3.12-slim
  variables:
    DATABASE_URL: postgresql+asyncpg://digdigdoc:digdigdoc@postgres:5432/digdigdoc
    REDIS_URL: redis://redis:6379/0
    VERIFY_TOKEN_MODEL: full-access
    S3_ENDPOINT_URL: http://rustfs:9000
    S3_ACCESS_KEY: rustfsadmin
    S3_SECRET_KEY: rustfsadmin
    S3_BUCKET: dig-dig-doc
    RUSTFS_VOLUMES: /data/rustfs0
    RUSTFS_ADDRESS: 0.0.0.0:9000
    RUSTFS_ACCESS_KEY: rustfsadmin
    RUSTFS_SECRET_KEY: rustfsadmin
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_USER: digdigdoc
        POSTGRES_PASSWORD: digdigdoc
        POSTGRES_DB: digdigdoc
    - name: redis:7-alpine
      alias: redis
    - name: rustfs/rustfs:latest
      alias: rustfs
  before_script:
    - pip install --no-cache-dir uv
  script:
    - cd backend
    - uv sync --group test
    - uv run alembic upgrade head
    - uv run pytest -q

unit-tests-worker-document-process:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir uv
  script:
    - cd worker/document_process
    - uv sync
    - uv run pytest -q

unit-tests-worker-agent-execution:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir uv
  script:
    - cd worker/agent_execution
    - uv sync
    - uv run pytest -q

.docker-build-common:
  stage: docker-build
  extends:
    - .kaniko:build-push
  variables:
    IMAGE_NAMES: ""  # Overridden in before_script
    EXTRA_BUILD_ARGS: "--build-arg DOCKERHUB_MIRROR_URL=${DOCKERHUB_MIRROR_URL}"
  rules:
    - when: always

# Pas de Helm/appVersion ici (contrairement à Muffin) : le chart n'existe pas
# encore (voir issue Helm, différée). La version vient donc directement de
# backend/pyproject.toml, seule source de vérité que release-please tient à
# jour - synchronisée sur tous les services du monorepo (release-type
# "simple", voir .github/releases/release-please-config-*.json). Extraction
# dupliquée dans chaque job ci-dessous plutôt que factorisée : un ancrage
# YAML ne se résout pas à l'intérieur d'un bloc littéral `before_script: |`,
# ça resterait le texte "*app-version" dans le script shell.

docker-build-backend:
  extends:
    - .docker-build-common
  variables:
    DOCKERFILE: "backend/Dockerfile"
    WORKING_DIR: "backend"
  before_script:
    - |
      SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-7)
      APP_VERSION=$(grep '^version' backend/pyproject.toml | head -1 | cut -d'"' -f2)
      if [ -z "$APP_VERSION" ]; then
        echo "Error: Could not extract version from backend/pyproject.toml"
        exit 1
      fi
      TAGS="dig-dig-doc-backend:$SHORT_SHA"
      TAGS="$TAGS dig-dig-doc-backend:$CI_COMMIT_REF_SLUG"
      TAGS="$TAGS dig-dig-doc-backend:$APP_VERSION"
      if echo "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        TAGS="$TAGS dig-dig-doc-backend:latest"
      fi
      export IMAGE_NAMES="$TAGS"
      echo "Building with tags: $IMAGE_NAMES"

docker-build-frontend:
  extends:
    - .docker-build-common
  variables:
    DOCKERFILE: "frontend/Dockerfile"
    WORKING_DIR: "frontend"
  before_script:
