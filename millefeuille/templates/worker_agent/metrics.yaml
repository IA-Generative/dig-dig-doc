{{- if .Values.enabled }}
{{- if .Values.worker_agent.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_agent-metrics") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_agent-metrics")) | nindent 4 }}
  {{- if .Values.worker_agent.metrics.service.labels }}
    {{- toYaml .Values.worker_agent.metrics.service.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.worker_agent.metrics.service.annotations }}
  annotations: {{- toYaml .Values.worker_agent.metrics.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.worker_agent.metrics.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.worker_agent.metrics.service.port }}
    targetPort: {{ .Values.worker_agent.metrics.service.targetPort }}
    protocol: TCP
    name: {{ .Values.worker_agent.metrics.service.portName | default "metrics" }}
  selector: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_agent") | nindent 4 }}
{{- end }}
{{- end }}
