{{- if .Values.enabled }}
{{- if eq .Values.worker_agent.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_agent") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_agent")) | nindent 4 }}
spec:
  {{- if not .Values.worker_agent.autoscaling.enabled }}
  replicas: {{ .Values.worker_agent.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.worker_agent.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_agent") | nindent 6 }}
  strategy:
    type: {{ .Values.worker_agent.strategy.type }}
    {{- if eq .Values.worker_agent.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.worker_agent.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.worker_agent.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_agent" "component" .Values.worker_agent) | nindent 4 }}
{{- end }}
{{- end }}
