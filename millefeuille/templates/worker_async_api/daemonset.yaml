{{- if and .Values.enabled .Values.worker_async_api.enabled }}
{{- if eq .Values.worker_async_api.deploymentType "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_async_api") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_async_api")) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.worker_async_api.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_async_api") | nindent 6 }}
  {{- with .Values.worker_async_api.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_async_api" "component" .Values.worker_async_api) | nindent 4 }}
{{- end }}
{{- end }}
