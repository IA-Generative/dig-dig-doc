[project]
name = "dig-dig-doc-async-api-worker"
version = "0.1.0"
description = "Worker AsyncTaskAPI (RabbitMQ, sans Celery) qui exécute des analyses dig-dig-doc via l'API éphémère"
requires-python = ">=3.13"
dependencies = [
    "digdigdoc",
    "digdigdoc-ephemeral",
    # Bibliothèque de worker d'async-api : non publiée sur PyPI, donc épinglée sur un commit.
    "mic-worker @ git+https://github.com/IA-Generative/async-api@8c109970c528cc622c04e6a3488d0e73be9bcd0a#subdirectory=workers/python/mic-worker",
    "loguru>=0.7.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

# Les SDK du monorepo (même chemin relatif en local et dans l'image : voir Dockerfile).
[tool.uv.sources]
digdigdoc-ephemeral = { path = "../../sdks/python/digdigdoc-ephemeral", editable = true }
# editable : le SDK éphémère déclare lui-même digdigdoc en editable, uv refuse deux déclarations divergentes.
digdigdoc = { path = "../../sdks/python/digdigdoc", editable = true }

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../../sdks/python/testing"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
omit = ["**/__init__.py", "src/logger.py", "src/config.py"]
