title = "mille-feuille gitleaks config"

# `targetRules` on a global allowlist needs v8.25.0; CI pins a newer version.
minVersion = "v8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "Helm chart test fixtures (chart was named digdigdoc before the rename, history still carries that path): fake Secret manifests used by `ct lint`/`helm template`, never real credentials."
targetRules = ["kubernetes-secret-yaml"]
paths = ['''(digdigdoc|millefeuille)/test-values\.yaml''']
